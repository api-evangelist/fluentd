- aid: fluentd:fluentd-forward-protocol
  name: Fluentd Forward Protocol
  description: >-
    The Fluentd Forward Protocol is a binary protocol used to transport event streams between Fluentd
    nodes and compatible agents over TCP. It supports multiple transport modes including Message, Forward,
    PackedForward, and CompressedPackedForward, and includes authentication and heartbeat mechanisms.
  humanURL: https://github.com/fluent/fluentd/wiki/Forward-Protocol-Specification-v1
  tags:
  - Logging
  - Networking
  - Protocol
  properties:
